name: CI/CD Deploy Beta

on:
  push:
    branches:
      - deploy-beta
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-beta
  cancel-in-progress: true

env:
  PROJECT_DIR: PFF_TFG
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1

jobs:
  ci:
    name: Quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PFF_TFG

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: PFF_TFG/package-lock.json

      - name: Verify project files
        run: |
          test -f composer.json
          test -f package.json
          test -f artisan
          test -f Dockerfile
          test -f docker-compose.beta.yml

      - name: Install PHP dependencies
        run: composer install --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Frontend checks
        run: npm run cicheck

      - name: Backend tests
        run: php artisan test

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: ci

    outputs:
      app_image: ${{ steps.meta.outputs.app_image }}
      nginx_image: ${{ steps.meta.outputs.nginx_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize owner
        id: meta
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "app_image=ghcr.io/${OWNER_LC}/organizat-app" >> "$GITHUB_OUTPUT"
          echo "nginx_image=ghcr.io/${OWNER_LC}/organizat-nginx" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: ./PFF_TFG
          file: ./PFF_TFG/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}:${{ env.IMAGE_TAG }}
            ${{ steps.meta.outputs.app_image }}:beta
          cache-from: type=registry,ref=${{ steps.meta.outputs.app_image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.app_image }}:buildcache,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./PFF_TFG
          file: ./PFF_TFG/Dockerfile
          target: nginx
          push: true
          tags: |
            ${{ steps.meta.outputs.nginx_image }}:${{ env.IMAGE_TAG }}
            ${{ steps.meta.outputs.nginx_image }}:beta
          cache-from: type=registry,ref=${{ steps.meta.outputs.nginx_image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.nginx_image }}:buildcache,mode=max

  deploy:
    name: Deploy to beta
    runs-on: ubuntu-latest
    needs: build
    environment: beta

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_IMAGE: ${{ needs.build.outputs.app_image }}
          NGINX_IMAGE: ${{ needs.build.outputs.nginx_image }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          envs: APP_IMAGE,NGINX_IMAGE,IMAGE_TAG,GH_ACTOR,GH_TOKEN
          script: |
            set -eu

            cd ~/apps/PabloFdez_TFG/PFF_TFG

            if [ ! -f .env ]; then
              echo ".env no existe en el servidor. Aborto para no romper la configuración actual."
              exit 1
            fi

            git fetch --all --prune
            git switch deploy-beta
            git pull origin deploy-beta

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$APP_IMAGE|" .env
            else
              echo "APP_IMAGE=$APP_IMAGE" >> .env
            fi

            if grep -q '^NGINX_IMAGE=' .env; then
              sed -i "s|^NGINX_IMAGE=.*|NGINX_IMAGE=$NGINX_IMAGE|" .env
            else
              echo "NGINX_IMAGE=$NGINX_IMAGE" >> .env
            fi

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
            else
              echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            fi

            docker compose -f docker-compose.beta.yml pull app worker scheduler nginx
            docker compose -f docker-compose.beta.yml up -d app worker scheduler nginx

            docker compose -f docker-compose.beta.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.beta.yml exec -T app php artisan optimize:clear
            docker compose -f docker-compose.beta.yml exec -T app php artisan optimize
            docker compose -f docker-compose.beta.yml exec -T app php artisan queue:restart

            docker compose -f docker-compose.beta.yml ps

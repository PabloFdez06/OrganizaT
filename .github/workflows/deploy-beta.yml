name: CI + Deploy beta

on:
  push:
    branches:
      - deploy-beta

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, simplexml, xmlwriter, bcmath, gd, intl, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP formatting
        run: composer run lintcheck

      - name: Check frontend formatting
        run: npm run formatcheck

      - name: Check frontend lint
        run: npm run lintcheck

      - name: Check TypeScript types
        run: npm run typescheck

      - name: Build frontend assets
        run: npm run build

      - name: Run backend tests
        run: php artisan test

  deploy:
    name: Redeploy beta on droplet
    runs-on: ubuntu-latest
    needs: validate
    environment: beta

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BETA_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.BETA_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy remotely
        env:
          BETA_HOST: ${{ secrets.BETA_HOST }}
          BETA_USER: ${{ secrets.BETA_USER }}
          BETA_PATH: ${{ secrets.BETA_PATH }}
          BETA_BRANCH: deploy-beta
        run: |
          ssh "${BETA_USER}@${BETA_HOST}" <<EOF
            set -eu

            cd "${BETA_PATH}"
            git fetch --all --prune
            git switch "${BETA_BRANCH}"
            git reset --hard "origin/${BETA_BRANCH}"

            sh scripts/ops/deploy-beta.sh
            sh scripts/ops/inspect-beta.sh
          EOF

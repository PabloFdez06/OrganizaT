name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "22"
  IMAGE_TAG: ${{ github.sha }}
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1

jobs:
  backend_quality:
    name: Backend quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repo structure
        run: |
          test -f composer.json
          test -f composer.lock
          test -f package.json
          test -f package-lock.json
          test -f artisan
          test -f Dockerfile
          test -f docker-compose.prod.yml
          test -f phpunit.xml

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          extensions: curl, dom, mbstring, sqlite3, xml

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run Pint check
        run: composer lint:check

  frontend_quality:
    name: Frontend quality and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frontend structure
        run: |
          test -f package.json
          test -f package-lock.json
          test -f tsconfig.json
          test -f vite.config.ts
          test -f vitest.config.ts

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          extensions: curl, dom, mbstring, sqlite3, xml

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Generate Wayfinder artifacts
        run: |
          cp .env.example .env
          php artisan wayfinder:generate --with-form

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run cicheck

  backend_tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none
          extensions: curl, dom, mbstring, sqlite3, xml

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Generate Wayfinder artifacts
        run: |
          cp .env.example .env
          php artisan wayfinder:generate --with-form

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          php artisan key:generate --ansi
          php artisan migrate --graceful --ansi

      - name: Run backend tests
        run: php artisan test --without-tty

  build:
    name: Build and push images
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [backend_quality, frontend_quality, backend_tests]

    outputs:
      app_image: ${{ steps.meta.outputs.app_image }}
      nginx_image: ${{ steps.meta.outputs.nginx_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build context
        run: |
          test -f Dockerfile
          test -f docker-compose.prod.yml
          test -f package.json
          test -f composer.json

      - name: Normalize owner
        id: meta
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "app_image=ghcr.io/${OWNER_LC}/organizat-app" >> "$GITHUB_OUTPUT"
          echo "nginx_image=ghcr.io/${OWNER_LC}/organizat-nginx" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}:${{ env.IMAGE_TAG }}
            ${{ steps.meta.outputs.app_image }}:latest
          cache-from: type=registry,ref=${{ steps.meta.outputs.app_image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.app_image }}:buildcache,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: nginx
          push: true
          tags: |
            ${{ steps.meta.outputs.nginx_image }}:${{ env.IMAGE_TAG }}
            ${{ steps.meta.outputs.nginx_image }}:latest
          cache-from: type=registry,ref=${{ steps.meta.outputs.nginx_image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.nginx_image }}:buildcache,mode=max

  deploy:
    name: Deploy to production
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_IMAGE: ${{ needs.build.outputs.app_image }}
          NGINX_IMAGE: ${{ needs.build.outputs.nginx_image }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          envs: APP_IMAGE,NGINX_IMAGE,IMAGE_TAG,GH_ACTOR,GH_TOKEN,REPO_NAME,DEFAULT_BRANCH
          script: |
            set -eu

            BASE_DEPLOY_PATH="$HOME/apps/$REPO_NAME"

            if [ ! -d "$BASE_DEPLOY_PATH" ]; then
              echo "No existe el directorio de despliegue en $BASE_DEPLOY_PATH"
              exit 1
            fi

            resolve_checkout_path() {
              for candidate in \
                "$BASE_DEPLOY_PATH" \
                "$BASE_DEPLOY_PATH/PFF_TFG"
              do
                if [ -d "$candidate/.git" ] || [ -f "$candidate/.git" ]; then
                  printf '%s\n' "$candidate"
                  return 0
                fi
              done

              return 1
            }

            DEPLOY_PATH="$(resolve_checkout_path || true)"

            if [ -z "$DEPLOY_PATH" ]; then
              echo "No se encontró un checkout Git válido en $BASE_DEPLOY_PATH"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            git fetch --all --prune
            git switch "$DEFAULT_BRANCH"
            git pull origin "$DEFAULT_BRANCH"

            if [ ! -f docker-compose.prod.yml ]; then
              echo "Falta docker-compose.prod.yml en $DEPLOY_PATH tras actualizar el checkout"
              exit 1
            fi

            if [ ! -f .env ] && [ "$DEPLOY_PATH" = "$BASE_DEPLOY_PATH" ] && [ -f "$BASE_DEPLOY_PATH/PFF_TFG/.env" ]; then
              cp "$BASE_DEPLOY_PATH/PFF_TFG/.env" .env
            fi

            if [ ! -f .env ]; then
              echo ".env no existe en el servidor. Aborto para no romper la configuración actual."
              exit 1
            fi

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$APP_IMAGE|" .env
            else
              echo "APP_IMAGE=$APP_IMAGE" >> .env
            fi

            if grep -q '^NGINX_IMAGE=' .env; then
              sed -i "s|^NGINX_IMAGE=.*|NGINX_IMAGE=$NGINX_IMAGE|" .env
            else
              echo "NGINX_IMAGE=$NGINX_IMAGE" >> .env
            fi

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
            else
              echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            fi

            docker compose -f docker-compose.prod.yml config >/dev/null
            docker compose -f docker-compose.prod.yml pull app worker scheduler nginx
            docker compose -f docker-compose.prod.yml up -d app worker scheduler nginx

            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear
            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize
            docker compose -f docker-compose.prod.yml exec -T app php artisan queue:restart

            docker compose -f docker-compose.prod.yml ps
name: CI/CD Deploy Beta

on:
  push:
    branches:
      - deploy-beta

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-beta
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  WORKING_DIR: PabloFdez_TFG/PFF_TFG
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PabloFdez_TFG/PFF_TFG

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm install

      - name: Static checks
        run: |
          npm run lint:check
          npm run format:check
          npm run types:check

      - name: Run tests
        run: php artisan test

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize owner to lowercase
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Define image names
        run: |
          echo "APP_IMAGE=ghcr.io/${OWNER_LC}/organizat-app" >> $GITHUB_ENV
          echo "NGINX_IMAGE=ghcr.io/${OWNER_LC}/organizat-nginx" >> $GITHUB_ENV

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: PabloFdez_TFG/PFF_TFG
          file: PabloFdez_TFG/PFF_TFG/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.APP_IMAGE }}:beta
          cache-from: type=registry,ref=${{ env.APP_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.APP_IMAGE }}:buildcache,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: PabloFdez_TFG/PFF_TFG
          file: PabloFdez_TFG/PFF_TFG/Dockerfile
          target: nginx
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.NGINX_IMAGE }}:beta
          cache-from: type=registry,ref=${{ env.NGINX_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.NGINX_IMAGE }}:buildcache,mode=max

  deploy:
    name: Deploy beta
    runs-on: ubuntu-latest
    needs: build
    environment: beta

    steps:
      - name: Normalize owner to lowercase
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Define image names
        run: |
          echo "APP_IMAGE=ghcr.io/${OWNER_LC}/organizat-app" >> $GITHUB_ENV
          echo "NGINX_IMAGE=ghcr.io/${OWNER_LC}/organizat-nginx" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -eu

            cd ~/apps/PabloFdez_TFG/PFF_TFG

            git fetch --all --prune
            git switch deploy-beta
            git pull origin deploy-beta

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export APP_IMAGE="${{ env.APP_IMAGE }}"
            export NGINX_IMAGE="${{ env.NGINX_IMAGE }}"
            export IMAGE_TAG="${{ env.IMAGE_TAG }}"

            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${APP_IMAGE}|" .env
            else
              echo "APP_IMAGE=${APP_IMAGE}" >> .env
            fi

            if grep -q '^NGINX_IMAGE=' .env; then
              sed -i "s|^NGINX_IMAGE=.*|NGINX_IMAGE=${NGINX_IMAGE}|" .env
            else
              echo "NGINX_IMAGE=${NGINX_IMAGE}" >> .env
            fi

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi

            docker compose -f docker-compose.beta.yml pull app worker scheduler nginx
            docker compose -f docker-compose.beta.yml up -d app worker scheduler nginx

            docker compose -f docker-compose.beta.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.beta.yml exec -T app php artisan optimize:clear
            docker compose -f docker-compose.beta.yml exec -T app php artisan optimize
            docker compose -f docker-compose.beta.yml exec -T app php artisan queue:restart

            docker compose -f docker-compose.beta.yml ps

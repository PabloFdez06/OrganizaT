name: CI/CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  PROJECT_DIR: PFF_TFG
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1

jobs:
  ci:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PFF_TFG

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repo structure
        run: |
          test -f composer.json
          test -f package.json
          test -f package-lock.json
          test -f artisan
          test -f Dockerfile
          test -f docker-compose.prod.yml
          test -f phpunit.xml

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --optimize-autoloader

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi


  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: ci

    outputs:
      app_image: ${{ steps.meta.outputs.app_image }}
      nginx_image: ${{ steps.meta.outputs.nginx_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build context
        run: |
          test -f PFF_TFG/Dockerfile
          test -f PFF_TFG/docker-compose.prod.yml
          test -f PFF_TFG/package.json
          test -f PFF_TFG/composer.json

      - name: Normalize owner
        id: meta
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "app_image=ghcr.io/${OWNER_LC}/organizat-app" >> "$GITHUB_OUTPUT"
          echo "nginx_image=ghcr.io/${OWNER_LC}/organizat-nginx" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: ./PFF_TFG
          file: ./PFF_TFG/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}:${{ env.IMAGE_TAG }}
            ${{ steps.meta.outputs.app_image }}:latest
          cache-from: type=registry,ref=${{ steps.meta.outputs.app_image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.app_image }}:buildcache,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./PFF_TFG
          file: ./PFF_TFG/Dockerfile
          target: nginx
          push: true
          tags: |
            ${{ steps.meta.outputs.nginx_image }}:${{ env.IMAGE_TAG }}
            ${{ steps.meta.outputs.nginx_image }}:latest
          cache-from: type=registry,ref=${{ steps.meta.outputs.nginx_image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.nginx_image }}:buildcache,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_IMAGE: ${{ needs.build.outputs.app_image }}
          NGINX_IMAGE: ${{ needs.build.outputs.nginx_image }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          envs: APP_IMAGE,NGINX_IMAGE,IMAGE_TAG,GH_ACTOR,GH_TOKEN
          script: |
            set -eu

            cd ~/apps/PabloFdez_TFG/PFF_TFG

            if [ ! -f .env ]; then
              echo ".env no existe en el servidor. Aborto para no romper la configuración actual."
              exit 1
            fi

            git fetch --all --prune
            git switch main
            git pull origin main

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$APP_IMAGE|" .env
            else
              echo "APP_IMAGE=$APP_IMAGE" >> .env
            fi

            if grep -q '^NGINX_IMAGE=' .env; then
              sed -i "s|^NGINX_IMAGE=.*|NGINX_IMAGE=$NGINX_IMAGE|" .env
            else
              echo "NGINX_IMAGE=$NGINX_IMAGE" >> .env
            fi

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" .env
            else
              echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            fi

            docker compose -f docker-compose.prod.yml config >/dev/null
            docker compose -f docker-compose.prod.yml pull app worker scheduler nginx
            docker compose -f docker-compose.prod.yml up -d app worker scheduler nginx

            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear
            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize
            docker compose -f docker-compose.prod.yml exec -T app php artisan queue:restart

            docker compose -f docker-compose.prod.yml ps
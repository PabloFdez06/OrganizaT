name: linter

on:
  push:
    branches: [deploy-beta, develop, main, master, workos]
  pull_request:
    branches: [deploy-beta, develop, main, master, workos]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PFF_TFG

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: PFF_TFG/package-lock.json

      - name: Verify project files
        run: |
          test -f composer.json
          test -f package.json
          test -f artisan
          test -f eslint.config.js

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Run Pint check
        run: composer lintcheck

      - name: Check frontend format
        run: npm run formatcheck

      - name: Check frontend lint
        run: npm run lintcheck

      - name: Check frontend types
        run: npm run typescheck
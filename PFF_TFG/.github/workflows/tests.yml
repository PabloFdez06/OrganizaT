name: tests

on:
  push:
    branches: [deploy-beta, develop, main, master, workos]
  pull_request:
    branches: [deploy-beta, develop, main, master, workos]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.4", "8.5"]

    defaults:
      run:
        working-directory: PFF_TFG

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: PFF_TFG/package-lock.json

      - name: Verify project files
        run: |
          test -f composer.json
          test -f package.json
          test -f artisan
          test -f phpunit.xml

      - name: Install Node dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate --ansi

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: ./vendor/bin/pest